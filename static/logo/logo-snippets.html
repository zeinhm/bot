<!--
  ZENITH — wordmark logo: copy-paste snippets
  ───────────────────────────────────────────
  1) Load Inter + the wordmark CSS in your <head>:

     <link rel="stylesheet"
       href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap">
     <link rel="stylesheet" href="/static/logo/wordmark.css">

  2) Favicon + app-icon tags (put in <head>):

     <link rel="icon" type="image/svg+xml" href="/static/logo/favicon.svg">
     <link rel="icon" type="image/png" sizes="32x32" href="/static/logo/favicon-32.png">
     <link rel="icon" type="image/png" sizes="16x16" href="/static/logo/favicon-16.png">
     <link rel="apple-touch-icon" sizes="180x180" href="/static/logo/apple-touch-icon.png">
     <!-- PWA manifest: icon-192 → favicon-192.png, icon-512 → favicon-512.png -->

  3) Use the wordmark anywhere — just set font-size on the element.
-->

<!-- marketing hero / 40px -->
<a class="zenith-wordmark" href="/" style="font-size:40px">ZENITH<span class="dot">.</span></a>

<!-- landing nav / 18px -->
<a class="zenith-wordmark" href="/" style="font-size:18px">ZENITH<span class="dot">.</span></a>

<!-- app topbar / 15px -->
<a class="zenith-wordmark" href="/" style="font-size:15px">ZENITH<span class="dot">.</span></a>

<!-- footer / 16px -->
<a class="zenith-wordmark" href="/" style="font-size:16px">ZENITH<span class="dot">.</span></a>
