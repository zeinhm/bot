<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH — Page Not Found</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0F1117;color:#E6E8EB;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:grid;place-items:center}
        .wrap{text-align:center;padding:24px}
        .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#00C896,#00A67A);display:grid;place-items:center;font-size:20px;font-weight:700;color:#0F1117;margin:0 auto 32px;box-shadow:0 0 24px rgba(0,200,150,.25)}
        .code{font-size:64px;font-weight:700;color:#2A2F3A;letter-spacing:-2px;line-height:1}
        .msg{font-size:16px;font-weight:600;margin-top:12px}
        .sub{font-size:13px;color:#8A8F98;margin-top:6px}
        .link{display:inline-flex;align-items:center;gap:6px;margin-top:28px;color:#00C896;font-size:13px;font-weight:500;text-decoration:none;padding:8px 16px;border:1px solid rgba(0,200,150,.35);border-radius:6px;transition:all .15s}
        .link:hover{background:rgba(0,200,150,.12)}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo">Z</div>
        <div class="code">404</div>
        <div class="msg">Page not found</div>
        <div class="sub">The page you're looking for doesn't exist or has been moved.</div>
        <a href="/dashboard" class="link">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Dashboard
        </a>
    </div>
</body>
</html>
